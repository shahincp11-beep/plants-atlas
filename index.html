<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Map of Australian process plants, upcoming SAF and renewable fuel projects, engineering jobs and industry news.">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Plants Atlas">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Australian Process Plants Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: white app shell. Desktop top bar with nav; phone bottom tab bar. One view at a time (map, industries, projects, jobs, companies, news).
   Bold element: the sector spectrum — a stripe of every industry colour, sized by how many sites it has. Everything else stays white and quiet. */
:root{
  color-scheme:light;
  --white:#ffffff; --surface:#f6f7f9; --line:#e7e9ee; --ink:#13203a; --soft:#5b6578; --faint:#8a93a3; --brand:#2a5bd7;
  --c-eth:#f97316; --c-dist:#f59e0b; --c-saf:#0ea5e9; --c-bd:#22c55e; --c-wo:#64748b; --c-oil:#eab308; --c-sx:#14b8a6;
  --c-sugar:#ec4899; --c-chem:#8b5cf6; --c-spec:#a855f7; --c-oleo:#84cc16; --c-ref:#ef4444; --c-lng:#3b82f6; --c-h2:#06b6d4;
  --c-wtf:#10b981; --c-term:#94a3b8; --c-power:#d97706;
  --c-food:#fb7185; --c-paper:#a16207; --c-pharma:#6366f1; --c-metals:#475569; --c-water:#38bdf8; --c-eng:#13203a; --c-con:#78716c;
  --s-cons:#f97316; --s-appr:#eab308; --s-feed:#8b5cf6; --s-prefeed:#6366f1; --s-feas:#0ea5e9; --s-concept:#94a3b8; --s-pilot:#14b8a6; --s-op:#22c55e;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --bar:64px; --tab:68px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--white);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--brand)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:1200;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:1201;background:#fff}
.top-in{height:var(--bar);display:flex;align-items:center;gap:20px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:none}
.mark{width:30px;height:30px;border-radius:9px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:5px;background:var(--ink)}
.mark i{border-radius:50%}
.brand b{font:800 19px/1 var(--display);letter-spacing:-.01em}
.nav{display:flex;gap:2px;margin-left:12px}
.nav a{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:10px;text-decoration:none;color:var(--soft);font-weight:600;font-size:14.5px}
.nav a:hover{background:var(--surface);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--ink);color:#fff}
.nav svg,.tabbar svg{width:18px;height:18px;flex:none}
.updated{margin-left:auto;color:var(--faint);font-size:13px;white-space:nowrap}
.spectrum{display:flex;height:4px}
.spectrum i{display:block}
.tabbar{display:none}
@media (max-width:860px){
  .nav,.updated{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(7,1fr);position:fixed;left:0;right:0;bottom:0;z-index:1200;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--tab);text-decoration:none;color:var(--faint);font-size:10.5px;font-weight:600;min-width:0}
  .tabbar a[aria-current="page"]{color:var(--ink)}
  .tabbar a[aria-current="page"] svg{color:var(--brand)}
  .view{padding-bottom:calc(var(--tab) + 24px + env(safe-area-inset-bottom,0px))!important}
  #v-map{padding-bottom:0!important}
}
.view{max-width:1320px;margin:0 auto;padding:28px max(20px,env(safe-area-inset-right,0px)) 56px max(20px,env(safe-area-inset-left,0px))}
.view[hidden]{display:none}
.vhead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;margin-bottom:22px}
.vhead h1{font:800 clamp(30px,5vw,46px)/1.02 var(--display);letter-spacing:-.025em;margin:0;text-wrap:balance}
.vhead p{margin:6px 0 0;color:var(--soft);max-width:62ch}
.vhead .grow{flex:1 1 360px;min-width:0}

/* chips & controls */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;color:var(--soft);cursor:pointer;white-space:nowrap}
.chip:hover{border-color:#cfd4dc;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .d{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip .n{font-weight:500;opacity:.65}
.search{position:relative;flex:1 1 260px;max-width:420px}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px 11px 40px;font:15px var(--body);color:var(--ink)}
.search input:focus{background:#fff;border-color:var(--brand);outline:none;box-shadow:0 0 0 3px rgba(42,91,215,.15)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--faint)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#cfd4dc}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.scrollx{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.scrollx::-webkit-scrollbar{display:none}

/* map view */
#v-map{max-width:none;padding:0}
.mapshell{position:relative;height:calc(100dvh - var(--bar) - 4px - env(safe-area-inset-top,0px));min-height:420px}
@media (max-width:860px){.mapshell{height:calc(100dvh - var(--bar) - 4px - var(--tab) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}}
#map{position:absolute;inset:0;background:#dfe7ec}
.overlay{position:absolute;z-index:1000;pointer-events:none}
.overlay>*{pointer-events:auto}
.ov-top{top:14px;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.ov-top .search{max-width:420px;width:100%}
.ov-top .search input{background:#fff;box-shadow:0 6px 24px rgba(19,32,58,.14);border-color:transparent}
.ov-top .scrollx{max-width:100%}
.ov-top .chip{box-shadow:0 2px 10px rgba(19,32,58,.12);border-color:transparent}
.ov-bl{left:max(14px,env(safe-area-inset-left,0px));bottom:22px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.seg{display:flex;background:#fff;border-radius:12px;padding:3px;box-shadow:0 2px 12px rgba(19,32,58,.14)}
.seg button{border:0;background:none;padding:6px 11px;border-radius:9px;font-size:13px;font-weight:600;color:var(--soft);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.keycard{background:#fff;border-radius:12px;padding:9px 12px;box-shadow:0 2px 12px rgba(19,32,58,.14);font-size:12.5px;color:var(--soft);display:grid;grid-template-columns:auto auto;gap:5px 14px}
.keycard span{display:flex;align-items:center;gap:7px}
.note{position:absolute;z-index:1000;left:14px;right:14px;bottom:110px;background:#fff;border-radius:12px;padding:10px 14px;box-shadow:0 2px 12px rgba(19,32,58,.14);font-size:13.5px;color:var(--soft);max-width:460px}
@media (max-width:560px){.keycard{display:none}}

/* markers */
.pin{display:block;width:14px;height:14px;border-radius:50%;background:var(--c);border:2.5px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45);position:relative}
.pin.proj{border-radius:4px;transform:rotate(45deg);width:13px;height:13px}
.pin.idle,.pin.closed{background:#fff;border:3px solid var(--c)}
.pin.hire::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--c);opacity:.9;background:color-mix(in srgb,var(--c) 18%,transparent)}
.pin.proj.hire::after{border-radius:5px}
.pin.office{border-radius:3px;background:#fff;border:3px solid var(--c);width:13px;height:13px}
@media (prefers-reduced-motion:no-preference){.pin.hire::after{animation:pulse 2.6s ease-out infinite}}
@keyframes pulse{0%{transform:scale(.7);opacity:.9}70%{transform:scale(1.25);opacity:0}100%{opacity:0}}

/* popup content */
.pop{display:flex;flex-direction:column;gap:9px;font:14px/1.45 var(--body);color:var(--ink)}
.pop h3{font:700 19px/1.15 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.owner{color:var(--soft);margin:-4px 0 0;font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;background:color-mix(in srgb,var(--c) 13%,#fff);color:color-mix(in srgb,var(--c) 70%,#13203a)}
.tag .d{width:7px;height:7px;border-radius:50%;background:var(--c)}
.facts{display:grid;grid-template-columns:92px minmax(0,1fr);gap:4px 10px;margin:0;font-size:13.5px}
.facts dt{color:var(--faint)}
.facts dd{margin:0}
.pop p{margin:0}
.warn{font-size:12.5px;color:#b45309}
.joblist{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
.joblist h4{margin:0;font:700 14px var(--body)}
.mini{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border-radius:10px;padding:8px 10px}
.mini:hover{background:#eef1f6}
.mini b{display:block;font-weight:600;color:var(--brand)}
.mini span{font-size:12.5px;color:var(--soft)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{font-size:12.5px;font-weight:600;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px 9px;background:#fff}
.links a:hover{border-color:var(--brand);color:var(--brand)}
.muted{color:var(--soft);font-size:13px}

/* industries */
.ind-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:14px}
.ind{position:relative;text-align:left;border:1px solid var(--line);background:#fff;border-radius:18px;padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-height:190px;overflow:hidden}
.ind:hover{border-color:color-mix(in srgb,var(--c) 50%,#fff);box-shadow:0 8px 28px color-mix(in srgb,var(--c) 18%,transparent)}
.ind .orb{width:46px;height:46px;border-radius:14px;background:var(--c);display:grid;place-items:center;color:#fff;font:800 18px var(--display)}
.ind h3{font:700 19px/1.15 var(--display);margin:0;letter-spacing:-.01em}
.ind p{margin:0;color:var(--soft);font-size:14px}
.ind .counts{margin-top:auto;display:flex;gap:14px;font-size:13px;color:var(--soft)}
.ind .counts b{color:var(--ink);font-size:16px;font-family:var(--display);margin-right:3px}
.ind::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:color-mix(in srgb,var(--c) 9%,transparent)}
.ind-head{border-radius:22px;padding:26px;background:color-mix(in srgb,var(--c) 10%,#fff);display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.ind-head h1{font:800 clamp(28px,5vw,42px)/1.05 var(--display);margin:0;letter-spacing:-.02em}
.ind-head p{margin:0;color:var(--soft);max-width:62ch}
.back{align-self:flex-start;border:0;background:#fff;border-radius:999px;padding:6px 12px;font-weight:600;font-size:13.5px;cursor:pointer;box-shadow:0 1px 4px rgba(19,32,58,.1)}
.section-title{font:700 20px var(--display);margin:26px 0 12px;letter-spacing:-.01em}

/* site/project rows */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px}
.site{border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;background:#fff;min-width:0}
.site h4{margin:0;font:700 17px/1.2 var(--display);letter-spacing:-.005em}
.site .where{color:var(--soft);font-size:13.5px}
.site .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:4px}
.stage{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:color-mix(in srgb,var(--sc) 75%,#13203a)}
.stage::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--sc)}
.hiring{font-size:12.5px;font-weight:700;color:#047857;background:#ecfdf5;border-radius:999px;padding:2px 9px}

/* projects pipeline */
.pipeline{display:flex;height:14px;border-radius:999px;overflow:hidden;margin:4px 0 10px;background:var(--surface)}
.pipeline i{display:block;background:var(--sc)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--soft);margin-bottom:8px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--sc)}
.stagegroup h2{display:flex;align-items:baseline;gap:10px;font:700 22px var(--display);margin:30px 0 4px;letter-spacing:-.01em}
.stagegroup h2 i{width:12px;height:12px;border-radius:3px;background:var(--sc);align-self:center}
.stagegroup h2 small{font:500 14px var(--body);color:var(--faint)}
.stagegroup>p{margin:0 0 12px;color:var(--soft);font-size:14px}

/* jobs */
.jobs-layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:860px){.jobs-layout{grid-template-columns:minmax(0,1fr)}}
.side{position:sticky;top:calc(var(--bar) + 20px);display:flex;flex-direction:column;gap:18px}
@media (max-width:860px){.side{position:static}}
.side h3{margin:0 0 8px;font:700 14px var(--body);color:var(--soft)}
.job{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:#fff;text-decoration:none;color:var(--ink)}
.job:hover{border-color:#cfd4dc;box-shadow:0 6px 20px rgba(19,32,58,.07)}
.avatar{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font:800 17px var(--display);color:#fff;background:var(--c)}
.job b{display:block;font-size:15.5px;font-weight:700;line-height:1.3}
.job .sub{display:block;color:var(--soft);font-size:13.5px}
.job .right{text-align:right;font-size:12.5px;color:var(--faint);display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.lvl{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--surface);color:var(--soft);white-space:nowrap}
.lvl.senior{background:#eef2ff;color:#4338ca}.lvl.mid{background:#ecfeff;color:#0e7490}.lvl.junior{background:#f0fdf4;color:#15803d}.lvl.manager{background:#fff7ed;color:#c2410c}
.joblist2{display:flex;flex-direction:column;gap:10px}
@media (max-width:520px){.job{grid-template-columns:40px minmax(0,1fr)}.job .right{grid-column:2;flex-direction:row;align-items:center;text-align:left}.avatar{width:40px;height:40px}}

/* companies */
.co{border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;background:#fff;min-width:0}
.co-top{display:flex;gap:12px;align-items:center}
.co h4{margin:0;font:700 18px/1.2 var(--display)}
.co .kind{font-size:13px;color:var(--soft)}
.co .fit{align-self:flex-start;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;background:#fef3c7;color:#92400e}
.co .fit.top{background:#dcfce7;color:#166534}
.co .fit.hire{background:#dbeafe;color:#1e40af}

/* news */
.news-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:36px;align-items:start}
@media (max-width:960px){.news-layout{grid-template-columns:minmax(0,1fr)}}
.feed{display:flex;flex-direction:column}
.story{display:grid;grid-template-columns:86px minmax(0,1fr);gap:18px;padding:18px 0;border-top:1px solid var(--line)}
.story:first-child{border-top:0;padding-top:4px}
.story time{font:700 15px/1.2 var(--display);color:var(--ink)}
.story time small{display:block;font:500 12.5px var(--body);color:var(--faint);margin-top:3px}
.story h3{margin:4px 0 6px;font:700 20px/1.2 var(--display);letter-spacing:-.01em;text-wrap:balance}
.story p{margin:0 0 8px;color:var(--soft);max-width:66ch}
.story .src{font-size:13.5px;font-weight:600;text-decoration:none}
@media (max-width:520px){.story{grid-template-columns:minmax(0,1fr);gap:4px}}
.watch{border-radius:20px;background:var(--surface);padding:20px;display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(var(--bar) + 20px)}
@media (max-width:960px){.watch{position:static}}
.watch h3{margin:0;font:700 19px var(--display)}
.ms{display:grid;grid-template-columns:54px minmax(0,1fr);gap:12px}
.ms time{font:800 15px/1.1 var(--display);color:var(--brand)}
.ms b{display:block;font-size:14.5px}
.ms span{font-size:13px;color:var(--soft)}

.empty{padding:30px;text-align:center;color:var(--soft);border:1px dashed var(--line);border-radius:16px}
.foot{color:var(--faint);font-size:12.5px;margin-top:36px;max-width:80ch}


/* CV match */
.ring{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--rc) calc(var(--p)*1%),#eef0f4 0);flex:none}
.ring b{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;font:800 14px var(--display);color:var(--ink)}
.why{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.why i{font-style:normal;font-size:11.5px;font-weight:600;color:var(--soft);background:var(--surface);border-radius:6px;padding:1px 7px}
.tier{margin-bottom:26px}
.tier h2{display:flex;align-items:center;gap:10px;font:700 21px var(--display);margin:0 0 2px;letter-spacing:-.01em}
.tier h2 small{font:500 14px var(--body);color:var(--faint)}
.tn{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--ink);color:#fff;font:800 13px var(--display)}
.me{background:linear-gradient(135deg,#eef4ff,#f3fbf6);border-radius:16px;padding:14px}
.me p{margin:0;font-size:13.5px;color:var(--ink)}

/* contacts */
.contacts-layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:32px;align-items:start}
@media (max-width:960px){.contacts-layout{grid-template-columns:minmax(0,1fr)}}
.todo{border-radius:18px;background:linear-gradient(135deg,#eef4ff,#f5f3ff);padding:18px;display:flex;flex-direction:column;gap:10px}
.todo h2{margin:0;font:700 20px var(--display)}
.td{background:#fff;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;border-left:4px solid var(--brand)}
.td span{font-size:13.5px;color:var(--soft)}
.td-withdraw{border-left-color:#ef4444}.td-retry{border-left-color:#d97706}.td-message{border-left-color:#16a34a}.td-connect{border-left-color:#2a5bd7}
.ct{border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:9px;background:#fff;min-width:0}
.ct h4{margin:0;font:700 17px/1.2 var(--display)}
.ct .kind{font-size:13px;color:var(--soft)}
.cs{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;color:var(--sc);background:color-mix(in srgb,var(--sc) 12%,#fff)}
.acts{display:flex;flex-wrap:wrap;gap:6px}

const LKEY="pa_li_v1", LI_REFRESH_DAYS=14;
function loadLI(){try{const s=localStorage.getItem(LKEY);if(s)return JSON.parse(s)}catch(e){}return null}
let LI=loadLI();
function saveLI(){try{localStorage.setItem(LKEY,JSON.stringify(LI))}catch(e){}}
const normUrl=u=>(u||"").toLowerCase().replace(/^https?:\/\/(www\.|[a-z]{2}\.)?/,"").replace(/[?#].*$/,"").replace(/\/+$/,"");
const normName=n=>(n||"").toLowerCase().replace(/\s+/g," ").trim();
function parseCSV(text){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;else if(ch===","){row.push(f);f=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}
    else f+=ch}
  if(f||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()));
}
function tableFrom(text,mustHave){const rows=parseCSV(text);const h=rows.findIndex(r=>mustHave.every(k=>r.some(c=>c.trim().toLowerCase()===k)));if(h<0)return null;
  const head=rows[h].map(c=>c.trim().toLowerCase());return rows.slice(h+1).map(r=>Object.fromEntries(head.map((k,i)=>[k,(r[i]||"").trim()])))}
const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function liDate(s){if(!s)return "";let m=s.match(/(\d{1,2})\s+([A-Za-z]{3})\w*\s+(\d{4})/);if(m)return `${m[3]}-${String(MON[m[2].toLowerCase()]||1).padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(m){const y=m[3].length===2?"20"+m[3]:m[3];return `${y}-${m[1].padStart(2,"0")}-${m[2].padStart(2,"0")}`}
  m=s.match(/(\d{4})-(\d{2})-(\d{2})/);return m?m[0]:""}
async function readExport(files){
  const texts=[];
  for(const file of files){
    if(/\.zip$/i.test(file.name)||file.type.includes("zip")){
      if(typeof JSZip==="undefined")await new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";s.onload=res;s.onerror=()=>rej(new Error("zip"));document.head.appendChild(s)});
      const z=await JSZip.loadAsync(file);
      for(const name of Object.keys(z.files)){if(/(^|\/)(connections|invitations)\.csv$/i.test(name))texts.push([name,await z.files[name].async("string")])}
    } else texts.push([file.name,await file.text()]);
  }
  let conns=null,invs=null;
  for(const [name,t] of texts){
    const c=tableFrom(t,["first name","last name"]);if(c&&(/connection/i.test(name)||(c[0]&&("connected on" in c[0]))))conns=c;
    const iv=tableFrom(t,["from","to"]);if(iv&&iv[0]&&("direction" in iv[0]||"sent at" in iv[0]))invs=iv;
  }
  return {conns,invs};
}
function applyLI(){
  if(!LI)return {connected:0,pending:0,closed:0};
  const byUrl=new Map(),byName=new Map();LI.connections.forEach(c=>{if(c.url)byUrl.set(normUrl(c.url),c);byName.set(normName(c.name),c)});
  const invByUrl=new Map(),invByName=new Map();LI.invites.forEach(i=>{if(i.url)invByUrl.set(normUrl(i.url),i);invByName.set(normName(i.name),i)});
  let connected=0,pending=0,closed=0;
  CONTACTS.forEach(ct=>{
    const k=normUrl(ct.url),n=normName(ct.name);
    const con=(k&&byUrl.get(k))||byName.get(n);
    const inv=(k&&invByUrl.get(k))||invByName.get(n);
    if(con){if(ct.req!=="connected")connected++;ct.req="connected";ct.follow=true;if(!ct.url&&con.url)ct.url=con.url;if(!ct.title&&con.position)ct.title=con.position}
    else if(inv){if(ct.req!=="pending")pending++;ct.req="pending";ct.reqDate=inv.date||ct.reqDate||today();ct.follow=true;if(!ct.url&&inv.url)ct.url=inv.url}
    else if(ct.req==="pending"){ct.req="withdrawn";ct.wdDate=today();closed++}
  });
  saveContacts();return {connected,pending,closed};
}
function liTodos(){
  const out=[];
  if(!LI)out.push([{name:"LinkedIn",url:"https://www.linkedin.com/mypreferences/d/download-my-data",co:""},{k:"connect",t:"Import your LinkedIn data",s:"So the app knows who you're connected with and which requests are waiting. Steps are in the LinkedIn sync box."}]);
  else{
    if(daysSince(LI.importedAt)>=LI_REFRESH_DAYS)out.push([{name:"LinkedIn",url:"https://www.linkedin.com/mypreferences/d/download-my-data",co:""},{k:"retry",t:"Refresh your LinkedIn import",s:`Last imported ${daysSince(LI.importedAt)} days ago. Download a new copy and import it.`}]);
    const tracked=new Set(CONTACTS.map(c=>normName(c.name)));
    LI.invites.filter(i=>i.date&&daysSince(i.date)>=WITHDRAW_DAYS&&!tracked.has(normName(i.name))).slice(0,15)
      .forEach(i=>out.push([{name:i.name,url:i.url,co:""},{k:"withdraw",t:`Withdraw your request to ${i.name}`,s:`Pending for ${daysSince(i.date)} days. Withdraw it on LinkedIn (My Network → Manage → Sent).`}]));
  }
  return out;
}
function targetMatch(company){const c=(company||"").toLowerCase();if(!c)return null;
  const emps=[...new Set(JOBS.map(j=>j.co))].concat(COMPANIES.map(x=>x.k));
  for(const k of emps){const nm=coLabel(k).toLowerCase().replace(/\(.*?\)/g,"").replace(/\b(australia|group|pty|ltd|limited|energy|engineering)\b/g,"").trim();const w=nm.split(/\s+/)[0];if(w&&w.length>=3&&(c.includes(nm)||c.split(/[^a-z0-9&]+/).includes(w)))return k}
  return null}
function knownAtTargets(){if(!LI)return [];const have=new Set(CONTACTS.map(c=>normName(c.name)));
  return LI.connections.map(c=>({...c,k:targetMatch(c.company)})).filter(c=>c.k&&!have.has(normName(c.name)))
    .sort((a,b)=>{const ba=bestJob(a.k),bb=bestJob(b.k);return (ba?matchOf(ba).tier:9)-(bb?matchOf(bb).tier:9)})}
function liPanel(){
  const st=LI?`Last import ${new Date(LI.importedAt+"T00:00:00").toLocaleDateString("en-AU",{day:"numeric",month:"short"})}: ${LI.connections.length} connections, ${LI.invites.length} pending requests.`:"Not imported yet.";
  return `<section class="lisync"><div class="lisync-h"><h2>LinkedIn sync</h2><span class="muted">${esc(st)}</span></div>
   <ol><li>On LinkedIn: <b>Me → Settings &amp; Privacy → Data privacy → Get a copy of your data</b>.</li><li>Choose <b>Want something in particular?</b> and tick <b>Connections</b> and <b>Invitations</b>, then <b>Request archive</b>.</li><li>Open LinkedIn's email, download the file, then tap <b>Import from LinkedIn</b> below and pick it (the .zip, or the two .csv files).</li></ol>
   <div class="acts"><label class="btn primary filebtn">Import from LinkedIn<input id="lifile" type="file" accept=".zip,.csv,application/zip,text/csv" multiple></label><a class="btn" href="https://www.linkedin.com/mypreferences/d/download-my-data" target="_blank" rel="noopener">Open LinkedIn data download</a></div>
   <p class="muted" id="liresult" style="margin:0">${esc(window._liMsg||"")}</p></section>`;
}
function knownPanel(){const k=knownAtTargets();if(!k.length)return "";
  return `<h2 class="section-title" style="margin-top:0">People you already know <small class="muted">${k.length}</small></h2><p class="muted" style="margin:0 0 10px">Your LinkedIn connections at employers with open roles. Save them to track and message.</p>
   <div class="emps" style="margin-bottom:22px">${k.slice(0,25).map((c,i)=>`<div class="emp"><div class="emp-h"><span class="avatar sm person" style="--c:${coColor(c.k)}">${initials(c.name)}${miniLogo(c.k)}</span><div style="min-width:0"><b>${esc(c.name)}</b><span class="muted">${esc(c.position||"")}${c.position?", ":""}${esc(c.company)}</span></div></div><div class="links">${c.url?`<a href="${c.url}" target="_blank" rel="noopener">Profile</a>`:""}<button class="linkbtn" data-savekn="${i}">Save as contact</button></div></div>`).join("")}</div>`}
$("#v-contacts").addEventListener("change",async e=>{
  if(e.target.id!=="lifile"||!e.target.files.length)return;
  window._liMsg="Reading your LinkedIn file…";const r=$("#liresult");if(r)r.textContent=window._liMsg;

      invites:invs?invs.filter(i=>/out/i.test(i.direction||"OUTGOING")).map(i=>({name:i.to||"",url:i.inviteeprofileurl||"",date:liDate(i["sent at"])})).filter(i=>i.name):prev.invites};
    saveLI();const s=applyLI();

  }catch(err){window._liMsg="Couldn't read that file. Try the two .csv files from inside the download instead."}

$("#v-contacts").addEventListener("click",e=>{const b=e.target.closest("[data-savekn]");if(!b)return;const c=knownAtTargets()[+b.dataset.savekn];if(!c)return;
  CONTACTS.unshift({id:"c"+Date.now(),name:c.name,title:c.position,co:c.k,url:c.url,follow:true,req:"connected",reqDate:"",wdDate:"",note:"Already a LinkedIn connection"});saveContacts();renderContacts();updateBadge()});

/* ---------- "What's here?": tap the map to identify sites (OpenStreetMap) ---------- */
const MKEY="pa_mysites_v1";
let MYSITES=(()=>{try{return JSON.parse(localStorage.getItem(MKEY)||"[]")}catch(e){return []}})();
const saveMySites=()=>{try{localStorage.setItem(MKEY,JSON.stringify(MYSITES))}catch(e){}};
let identifyOn=false, probe=null, myLayer=null, lastFound=[];
const OVERPASS=["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter"];
function distM(a,b,c,d){const R=6371000,t=Math.PI/180;const x=(d-b)*t*Math.cos((a+c)/2*t),y=(c-a)*t;return Math.round(Math.sqrt(x*x+y*y)*R)}
function guessCat(tags){const s=Object.entries(tags).map(([k,v])=>k+"="+v).join(" ").toLowerCase()+" "+(tags.name||"").toLowerCase()+" "+(tags.operator||"").toLowerCase();
  const R=[[/refiner|petroleum|fuel|oil terminal|bulk liquid/, "ref"],[/biodiesel/,"bd"],[/ethanol|distill/,"eth"],[/oilseed|canola|crush|edible oil|vegetable oil|cargill|graincorp|cmp oil/,"oil"],[/sugar/,"sugar"],[/oleo|tallow|render/,"oleo"],
   [/pharma|vaccin|biotech|csl|laborator/,"pharma"],[/paper|pulp|packag|cardboard|visy|opal/,"paper"],[/dairy|milk|cheese|food|bakery|brew|beverage|meat|abattoir|flour|mill/,"food"],
   [/steel|alumin|smelt|metal|foundry|cement|quarry|lithium|nickel|zinc/,"metals"],[/water|sewage|wastewater|treatment plant/,"water"],[/chemical|paint|coating|fertili|ammonia|plastic|polymer|resin|adhesive|gas/,"chem"],
   [/engineering|fabricat|machin|pump|valve|hydraulic|crane|contract/,"con"],[/power|generator|substation|solar|wind/,"power"]];
  for(const [re,c] of R)if(re.test(s))return c;return "chem"}
async function overpass(lat,lon,r){
  const q=`[out:json][timeout:25];(nwr(around:${r},${lat},${lon})["man_made"="works"];nwr(around:${r},${lat},${lon})["industrial"];nwr(around:${r},${lat},${lon})["landuse"="industrial"]["name"];nwr(around:${r},${lat},${lon})["building"~"industrial|warehouse|factory|manufacture"]["name"];nwr(around:${r},${lat},${lon})["office"="company"]["name"];nwr(around:${r},${lat},${lon})["craft"]["name"];nwr(around:${r},${lat},${lon})["landuse"="industrial"]["operator"];);out center tags 60;`;
  for(const url of OVERPASS){try{const res=await fetch(url,{method:"POST",body:"data="+encodeURIComponent(q),headers:{"Content-Type":"application/x-www-form-urlencoded"}});if(res.ok)return (await res.json()).elements||[]}catch(e){}}
  throw new Error("lookup");
}
async function reverseGeo(lat,lon){try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=17&addressdetails=1&lat=${lat}&lon=${lon}`,{headers:{"Accept-Language":"en-AU"}});if(r.ok)return await r.json()}catch(e){}return null}
async function wikiSummary(q){try{
  const s=await fetch(`https://en.wikipedia.org/w/api.php?action=query&list=search&srlimit=1&format=json&origin=*&srsearch=${enc(q+" company Australia")}`).then(r=>r.json());
  const t=s.query&&s.query.search&&s.query.search[0];if(!t)return null;const key=(q.toLowerCase().replace(/\b(pty|ltd|limited|australia|group|the|plant|site|factory|mill)\b/g,'').match(/[a-z0-9]{3,}/)||[''])[0];if(!key||!t.title.toLowerCase().includes(key))return null;
  const p=await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${enc(t.title)}`).then(r=>r.json());
  return p&&p.extract?{title:p.title,text:p.extract,url:p.content_urls&&p.content_urls.desktop&&p.content_urls.desktop.page}:null}catch(e){return null}}
function placeName(tags){return tags.name||tags.operator||tags.brand||tags["name:en"]||""}
function panel(html){let p=$("#idpanel");if(!p){p=document.createElement("div");p.id="idpanel";p.className="idpanel";$(".mapshell").appendChild(p)}p.innerHTML=`<button class="idclose" aria-label="Close" data-idclose>×</button>`+html;p.hidden=false}
function closePanel(){const p=$("#idpanel");if(p)p.hidden=true;if(probe&&map){map.removeLayer(probe);probe=null}}
function setIdentify(on){identifyOn=on;const b=$("#idbtn");if(b){b.setAttribute("aria-pressed",on);b.textContent=on?"Tap the map…":"What's here?"}if(map)map.getContainer().style.cursor=on?"crosshair":""}
async function identifyAt(lat,lon){
  if(probe)map.removeLayer(probe);
  probe=L.circle([lat,lon],{radius:600,color:"#2a5bd7",weight:2,fillOpacity:.06,interactive:false}).addTo(map);
  panel(`<h3>Looking around this spot…</h3><p class="muted">Checking OpenStreetMap for factories, works and companies within 600 m.</p>`);
  const near=ITEMS.filter(i=>distM(lat,lon,i.lat,i.lon)<1500).sort((a,b)=>distM(lat,lon,a.lat,a.lon)-distM(lat,lon,b.lat,b.lon)).slice(0,4);
  let els=[],addr=null;
  try{[els,addr]=await Promise.all([overpass(lat,lon,600),reverseGeo(lat,lon)])}catch(e){
    panel(`<h3>Couldn't look up this spot</h3><p class="muted">The map data service didn't respond. This works on your published site, not inside Claude's preview. Try again in a moment.</p>${linksAt(lat,lon,"")}`);return}
  const seen=new Set();const found=[];
  els.forEach(e=>{const t=e.tags||{};const nm=placeName(t);if(!nm)return;const key=nm.toLowerCase();if(seen.has(key))return;seen.add(key);
    const la=e.lat||(e.center&&e.center.lat),lo=e.lon||(e.center&&e.center.lon);if(la==null)return;
    found.push({name:nm,operator:t.operator||"",product:t.product||t.industrial||t.man_made||t.craft||t.building||"",website:t.website||t["contact:website"]||"",lat:la,lon:lo,d:distM(lat,lon,la,lo),cat:guessCat(t)})});
  found.sort((a,b)=>a.d-b.d);lastFound=found.slice(0,12);
  const a=addr&&addr.address||{};const where=[a.road,a.suburb||a.town||a.city_district||a.city,a.state].filter(Boolean).join(", ");
  panel(`<h3>What's here</h3><p class="muted" style="margin:0 0 8px">${esc(where||`${lat.toFixed(4)}, ${lon.toFixed(4)}`)}</p>
    ${near.length?`<div class="idsec"><b>Already on your map</b>${near.map(i=>`<button class="idrow" data-go="${i.i}"><span class="d" style="--c:${col(i.cats[0])}"></span>${esc(i.n)}<small>${(distM(lat,lon,i.lat,i.lon)/1000).toFixed(1)} km</small></button>`).join("")}</div>`:""}
    <div class="idsec"><b>${lastFound.length?`Found nearby (${lastFound.length})`:"Nothing named nearby in OpenStreetMap"}</b>
    ${lastFound.map((f,k)=>`<div class="idcard" data-k="${k}"><div class="idtop"><span class="d" style="--c:${col(f.cat)}"></span><b>${esc(f.name)}</b><small>${f.d} m</small></div>
      <div class="muted">${esc([f.operator&&f.operator!==f.name?f.operator:"",f.product].filter(Boolean).join(", ")||CATS[f.cat].l)}</div>
      <div class="idresearch" id="idr-${k}"><span class="muted">Researching…</span></div>
      ${linksAt(f.lat,f.lon,f.name,f.website)}
      <div class="acts"><select class="idcat" aria-label="Industry">${Object.entries(CATS).map(([c,v])=>`<option value="${c}"${c===f.cat?" selected":""}>${v.l}</option>`).join("")}</select><button class="btn primary" data-addfound="${k}">Add to my list</button></div></div>`).join("")}</div>
    <div class="idsec"><b>Not listed?</b><p class="muted" style="margin:2px 0 6px">Check the spot on Google Maps, then add it yourself.</p>${linksAt(lat,lon,"")}
    <form class="idform" data-lat="${lat}" data-lon="${lon}"><input id="idname" placeholder="Company or site name" required><select id="idcat2">${Object.entries(CATS).map(([c,v])=>`<option value="${c}">${v.l}</option>`).join("")}</select><button class="btn" type="submit">Add this spot</button></form></div>`);
  lastFound.forEach(async(f,k)=>{
    const jobs=JOBS.filter(j=>{const n=jobCo(j).toLowerCase();const w=f.name.toLowerCase().split(/\s+/)[0];return w.length>2&&(n.includes(w)||f.name.toLowerCase().includes(n.split(/\s+/)[0]))});
    const w=await wikiSummary(f.operator||f.name);const el=$("#idr-"+k);if(!el)return;
    el.innerHTML=(w?`<p style="margin:4px 0">${esc(w.text.length>320?w.text.slice(0,317)+"…":w.text)}${w.url?` <a href="${w.url}" target="_blank" rel="noopener">Wikipedia</a>`:""}</p>`:`<span class="muted">No encyclopedia entry found; use the links below.</span>`)+
      (jobs.length?`<p style="margin:4px 0"><span class="hiring">${jobs.length} matching job${jobs.length>1?"s":""} in your list</span></p>`:"");
    f.summary=w?w.text.slice(0,400):"";
  });
}
function linksAt(lat,lon,name,web){const q=name?enc(name):"";return `<div class="links">
  <a href="https://www.google.com/maps/search/?api=1&query=${name?q+"%20":""}${lat},${lon}" target="_blank" rel="noopener">Google Maps</a>
  ${name?`<a href="https://www.google.com/search?q=${q}%20manufacturing%20Australia" target="_blank" rel="noopener">Web search</a><a href="https://www.linkedin.com/search/results/companies/?keywords=${q}" target="_blank" rel="noopener">LinkedIn</a><a href="https://www.seek.com.au/jobs?keywords=${q}" target="_blank" rel="noopener">Seek jobs</a>`:""}
  ${web?`<a href="${esc(web)}" target="_blank" rel="noopener">Website</a>`:""}</div>`}
function addMySite(s){MYSITES.unshift({id:"m"+Date.now(),...s,added:today()});saveMySites();drawMySites()}
function drawMySites(){
  if(!map)return;if(myLayer)map.removeLayer(myLayer);myLayer=L.layerGroup();
  if(mapFilter.kind==="all"||mapFilter.kind==="mine")MYSITES.forEach(s=>{
    if(mapFilter.cat&&mapFilter.cat!==s.cat)return;
    const m=L.marker([s.lat,s.lon],{icon:L.divIcon({className:"",html:`<span class="pin mine" style="--c:${col(s.cat)}"></span>`,iconSize:[18,18],iconAnchor:[9,9],popupAnchor:[0,-9]}),zIndexOffset:600,title:s.name});
    m.bindPopup(()=>`<div class="pop"><span class="stage" style="--sc:#2a5bd7">My site</span><h3>${esc(s.name)}</h3><p class="owner">${CATS[s.cat]?CATS[s.cat].l:""}</p>${s.where?`<p class="muted">${esc(s.where)}</p>`:""}${s.summary?`<p>${esc(s.summary)}</p>`:""}${linksAt(s.lat,s.lon,s.name,s.website)}
      <div class="acts"><button class="btn" data-copysite="${s.id}">Copy for Claude</button><button class="btn ghost" data-delsite="${s.id}">Remove</button></div><p class="muted" style="margin:0">Paste into Claude to research it fully and add it to everyone's map.</p></div>`,{maxWidth:300});
    myLayer.addLayer(m)});
  myLayer.addTo(map);
}
document.addEventListener("click",e=>{
  if(e.target.closest("[data-idclose]")){closePanel();return}
  const af=e.target.closest("[data-addfound]");if(af){const f=lastFound[+af.dataset.addfound];const sel=af.parentElement.querySelector(".idcat");
    addMySite({name:f.name,cat:sel?sel.value:f.cat,lat:f.lat,lon:f.lon,website:f.website,summary:f.summary||"",where:f.operator||""});af.textContent="Added";af.disabled=true;return}
  const cs=e.target.closest("[data-copysite]");if(cs){const s=MYSITES.find(x=>x.id===cs.dataset.copysite);if(s)copyText(`Please add this site to my Plants Atlas app (shahincp11-beep/plants-atlas) with full research: ${s.name}, ${CATS[s.cat]?CATS[s.cat].l:""}, at ${s.lat.toFixed(5)}, ${s.lon.toFixed(5)}${s.website?", website "+s.website:""}.`,cs);return}
  const ds=e.target.closest("[data-delsite]");if(ds){if(ds.dataset.confirm!=="1"){ds.dataset.confirm="1";ds.textContent="Tap again to remove";return}MYSITES=MYSITES.filter(x=>x.id!==ds.dataset.delsite);saveMySites();map.closePopup();drawMySites();return}
});
document.addEventListener("submit",e=>{const f=e.target.closest(".idform");if(!f)return;e.preventDefault();
  addMySite({name:$("#idname").value.trim(),cat:$("#idcat2").value,lat:+f.dataset.lat,lon:+f.dataset.lon,website:"",summary:"",where:""});
  const b=f.querySelector("button");b.textContent="Added";b.disabled=true});
function initIdentify(){
  if(!map)return;
  const ov=$(".ov-bl");const b=document.createElement("button");b.id="idbtn";b.className="idbtn";b.textContent="What's here?";b.setAttribute("aria-pressed","false");
  b.onclick=()=>setIdentify(!identifyOn);ov.insertBefore(b,ov.firstChild);
  map.on("click",e=>{if(!identifyOn)return;setIdentify(false);identifyAt(e.latlng.lat,e.latlng.lng)});
  drawMySites();
}

mapChips();renderIndustries();renderProjects();renderJobs();renderCompanies();renderNews();renderContacts();initMap();initIdentify();route();updateBadge();loadLive();
