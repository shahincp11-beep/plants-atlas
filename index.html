<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Map of Australian process plants, upcoming SAF and renewable fuel projects, engineering jobs and industry news.">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Plants Atlas">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Australian Process Plants Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: white app shell. Desktop top bar with nav; phone bottom tab bar. One view at a time (map, industries, projects, jobs, companies, news).
   Bold element: the sector spectrum — a stripe of every industry colour, sized by how many sites it has. Everything else stays white and quiet. */
:root{
  color-scheme:light;
  --white:#ffffff; --surface:#f6f7f9; --line:#e7e9ee; --ink:#13203a; --soft:#5b6578; --faint:#8a93a3; --brand:#2a5bd7;
  --c-eth:#f97316; --c-dist:#f59e0b; --c-saf:#0ea5e9; --c-bd:#22c55e; --c-wo:#64748b; --c-oil:#eab308; --c-sx:#14b8a6;
  --c-sugar:#ec4899; --c-chem:#8b5cf6; --c-spec:#a855f7; --c-oleo:#84cc16; --c-ref:#ef4444; --c-lng:#3b82f6; --c-h2:#06b6d4;
  --c-wtf:#10b981; --c-term:#94a3b8; --c-power:#d97706;
  --s-cons:#f97316; --s-appr:#eab308; --s-feed:#8b5cf6; --s-prefeed:#6366f1; --s-feas:#0ea5e9; --s-concept:#94a3b8; --s-pilot:#14b8a6; --s-op:#22c55e;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --bar:64px; --tab:68px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--white);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--brand)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:1200;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:1201;background:#fff}
.top-in{height:var(--bar);display:flex;align-items:center;gap:20px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:none}
.mark{width:30px;height:30px;border-radius:9px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:5px;background:var(--ink)}
.mark i{border-radius:50%}
.brand b{font:800 19px/1 var(--display);letter-spacing:-.01em}
.nav{display:flex;gap:2px;margin-left:12px}
.nav a{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:10px;text-decoration:none;color:var(--soft);font-weight:600;font-size:14.5px}
.nav a:hover{background:var(--surface);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--ink);color:#fff}
.nav svg,.tabbar svg{width:18px;height:18px;flex:none}
.updated{margin-left:auto;color:var(--faint);font-size:13px;white-space:nowrap}
.spectrum{display:flex;height:4px}
.spectrum i{display:block}
.tabbar{display:none}
@media (max-width:860px){
  .nav,.updated{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:1200;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--tab);text-decoration:none;color:var(--faint);font-size:11px;font-weight:600}
  .tabbar a[aria-current="page"]{color:var(--ink)}
  .tabbar a[aria-current="page"] svg{color:var(--brand)}
  .view{padding-bottom:calc(var(--tab) + 24px + env(safe-area-inset-bottom,0px))!important}
  #v-map{padding-bottom:0!important}
}
.view{max-width:1320px;margin:0 auto;padding:28px max(20px,env(safe-area-inset-right,0px)) 56px max(20px,env(safe-area-inset-left,0px))}
.view[hidden]{display:none}
.vhead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;margin-bottom:22px}
.vhead h1{font:800 clamp(30px,5vw,46px)/1.02 var(--display);letter-spacing:-.025em;margin:0;text-wrap:balance}
.vhead p{margin:6px 0 0;color:var(--soft);max-width:62ch}
.vhead .grow{flex:1 1 360px;min-width:0}

/* chips & controls */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;color:var(--soft);cursor:pointer;white-space:nowrap}
.chip:hover{border-color:#cfd4dc;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .d{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip .n{font-weight:500;opacity:.65}
.search{position:relative;flex:1 1 260px;max-width:420px}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px 11px 40px;font:15px var(--body);color:var(--ink)}
.search input:focus{background:#fff;border-color:var(--brand);outline:none;box-shadow:0 0 0 3px rgba(42,91,215,.15)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--faint)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#cfd4dc}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.scrollx{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.scrollx::-webkit-scrollbar{display:none}

/* map view */
#v-map{max-width:none;padding:0}
.mapshell{position:relative;height:calc(100dvh - var(--bar) - 4px - env(safe-area-inset-top,0px));min-height:420px}
@media (max-width:860px){.mapshell{height:calc(100dvh - var(--bar) - 4px - var(--tab) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}}
#map{position:absolute;inset:0;background:#dfe7ec}
.overlay{position:absolute;z-index:1000;pointer-events:none}
.overlay>*{pointer-events:auto}
.ov-top{top:14px;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.ov-top .search{max-width:420px;width:100%}
.ov-top .search input{background:#fff;box-shadow:0 6px 24px rgba(19,32,58,.14);border-color:transparent}
.ov-top .scrollx{max-width:100%}
.ov-top .chip{box-shadow:0 2px 10px rgba(19,32,58,.12);border-color:transparent}
.ov-bl{left:max(14px,env(safe-area-inset-left,0px));bottom:22px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.seg{display:flex;background:#fff;border-radius:12px;padding:3px;box-shadow:0 2px 12px rgba(19,32,58,.14)}
.seg button{border:0;background:none;padding:6px 11px;border-radius:9px;font-size:13px;font-weight:600;color:var(--soft);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.keycard{background:#fff;border-radius:12px;padding:9px 12px;box-shadow:0 2px 12px rgba(19,32,58,.14);font-size:12.5px;color:var(--soft);display:grid;grid-template-columns:auto auto;gap:5px 14px}
.keycard span{display:flex;align-items:center;gap:7px}
.note{position:absolute;z-index:1000;left:14px;right:14px;bottom:110px;background:#fff;border-radius:12px;padding:10px 14px;box-shadow:0 2px 12px rgba(19,32,58,.14);font-size:13.5px;color:var(--soft);max-width:460px}
@media (max-width:560px){.keycard{display:none}}

/* markers */
.pin{display:block;width:14px;height:14px;border-radius:50%;background:var(--c);border:2.5px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45);position:relative}
.pin.proj{border-radius:4px;transform:rotate(45deg);width:13px;height:13px}
.pin.idle,.pin.closed{background:#fff;border:3px solid var(--c)}
.pin.hire::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--c);opacity:.9;background:color-mix(in srgb,var(--c) 18%,transparent)}
.pin.proj.hire::after{border-radius:5px}
@media (prefers-reduced-motion:no-preference){.pin.hire::after{animation:pulse 2.6s ease-out infinite}}
@keyframes pulse{0%{transform:scale(.7);opacity:.9}70%{transform:scale(1.25);opacity:0}100%{opacity:0}}

/* popup content */
.pop{display:flex;flex-direction:column;gap:9px;font:14px/1.45 var(--body);color:var(--ink)}
.pop h3{font:700 19px/1.15 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.owner{color:var(--soft);margin:-4px 0 0;font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;background:color-mix(in srgb,var(--c) 13%,#fff);color:color-mix(in srgb,var(--c) 70%,#13203a)}
.tag .d{width:7px;height:7px;border-radius:50%;background:var(--c)}
.facts{display:grid;grid-template-columns:92px minmax(0,1fr);gap:4px 10px;margin:0;font-size:13.5px}
.facts dt{color:var(--faint)}
.facts dd{margin:0}
.pop p{margin:0}
.warn{font-size:12.5px;color:#b45309}
.joblist{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
.joblist h4{margin:0;font:700 14px var(--body)}
.mini{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border-radius:10px;padding:8px 10px}
.mini:hover{background:#eef1f6}
.mini b{display:block;font-weight:600;color:var(--brand)}
.mini span{font-size:12.5px;color:var(--soft)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{font-size:12.5px;font-weight:600;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px 9px;background:#fff}
.links a:hover{border-color:var(--brand);color:var(--brand)}
.muted{color:var(--soft);font-size:13px}

/* industries */
.ind-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:14px}
.ind{position:relative;text-align:left;border:1px solid var(--line);background:#fff;border-radius:18px;padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-height:190px;overflow:hidden}
.ind:hover{border-color:color-mix(in srgb,var(--c) 50%,#fff);box-shadow:0 8px 28px color-mix(in srgb,var(--c) 18%,transparent)}
.ind .orb{width:46px;height:46px;border-radius:14px;background:var(--c);display:grid;place-items:center;color:#fff;font:800 18px var(--display)}
.ind h3{font:700 19px/1.15 var(--display);margin:0;letter-spacing:-.01em}
.ind p{margin:0;color:var(--soft);font-size:14px}
.ind .counts{margin-top:auto;display:flex;gap:14px;font-size:13px;color:var(--soft)}
.ind .counts b{color:var(--ink);font-size:16px;font-family:var(--display);margin-right:3px}
.ind::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:color-mix(in srgb,var(--c) 9%,transparent)}
.ind-head{border-radius:22px;padding:26px;background:color-mix(in srgb,var(--c) 10%,#fff);display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.ind-head h1{font:800 clamp(28px,5vw,42px)/1.05 var(--display);margin:0;letter-spacing:-.02em}
.ind-head p{margin:0;color:var(--soft);max-width:62ch}
.back{align-self:flex-start;border:0;background:#fff;border-radius:999px;padding:6px 12px;font-weight:600;font-size:13.5px;cursor:pointer;box-shadow:0 1px 4px rgba(19,32,58,.1)}
.section-title{font:700 20px var(--display);margin:26px 0 12px;letter-spacing:-.01em}

/* site/project rows */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px}
.site{border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;background:#fff;min-width:0}
.site h4{margin:0;font:700 17px/1.2 var(--display);letter-spacing:-.005em}
.site .where{color:var(--soft);font-size:13.5px}
.site .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:4px}
.stage{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:color-mix(in srgb,var(--sc) 75%,#13203a)}
.stage::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--sc)}
.hiring{font-size:12.5px;font-weight:700;color:#047857;background:#ecfdf5;border-radius:999px;padding:2px 9px}

/* projects pipeline */
.pipeline{display:flex;height:14px;border-radius:999px;overflow:hidden;margin:4px 0 10px;background:var(--surface)}
.pipeline i{display:block;background:var(--sc)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--soft);margin-bottom:8px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--sc)}
.stagegroup h2{display:flex;align-items:baseline;gap:10px;font:700 22px var(--display);margin:30px 0 4px;letter-spacing:-.01em}
.stagegroup h2 i{width:12px;height:12px;border-radius:3px;background:var(--sc);align-self:center}
.stagegroup h2 small{font:500 14px var(--body);color:var(--faint)}
.stagegroup>p{margin:0 0 12px;color:var(--soft);font-size:14px}

/* jobs */
.jobs-layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:860px){.jobs-layout{grid-template-columns:minmax(0,1fr)}}
.side{position:sticky;top:calc(var(--bar) + 20px);display:flex;flex-direction:column;gap:18px}
@media (max-width:860px){.side{position:static}}
.side h3{margin:0 0 8px;font:700 14px var(--body);color:var(--soft)}
.job{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:#fff;text-decoration:none;color:var(--ink)}
.job:hover{border-color:#cfd4dc;box-shadow:0 6px 20px rgba(19,32,58,.07)}
.avatar{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font:800 17px var(--display);color:#fff;background:var(--c)}
.job b{display:block;font-size:15.5px;font-weight:700;line-height:1.3}
.job .sub{display:block;color:var(--soft);font-size:13.5px}
.job .right{text-align:right;font-size:12.5px;color:var(--faint);display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.lvl{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--surface);color:var(--soft);white-space:nowrap}
.lvl.senior{background:#eef2ff;color:#4338ca}.lvl.mid{background:#ecfeff;color:#0e7490}.lvl.junior{background:#f0fdf4;color:#15803d}.lvl.manager{background:#fff7ed;color:#c2410c}
.joblist2{display:flex;flex-direction:column;gap:10px}
@media (max-width:520px){.job{grid-template-columns:40px minmax(0,1fr)}.job .right{grid-column:2;flex-direction:row;align-items:center;text-align:left}.avatar{width:40px;height:40px}}

/* companies */
.co{border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;background:#fff;min-width:0}
.co-top{display:flex;gap:12px;align-items:center}
.co h4{margin:0;font:700 18px/1.2 var(--display)}
.co .kind{font-size:13px;color:var(--soft)}
.co .fit{align-self:flex-start;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;background:#fef3c7;color:#92400e}
.co .fit.top{background:#dcfce7;color:#166534}
.co .fit.hire{background:#dbeafe;color:#1e40af}

/* news */
.news-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:36px;align-items:start}
@media (max-width:960px){.news-layout{grid-template-columns:minmax(0,1fr)}}
.feed{display:flex;flex-direction:column}
.story{display:grid;grid-template-columns:86px minmax(0,1fr);gap:18px;padding:18px 0;border-top:1px solid var(--line)}
.story:first-child{border-top:0;padding-top:4px}
.story time{font:700 15px/1.2 var(--display);color:var(--ink)}
.story time small{display:block;font:500 12.5px var(--body);color:var(--faint);margin-top:3px}
.story h3{margin:4px 0 6px;font:700 20px/1.2 var(--display);letter-spacing:-.01em;text-wrap:balance}
.story p{margin:0 0 8px;color:var(--soft);max-width:66ch}
.story .src{font-size:13.5px;font-weight:600;text-decoration:none}
@media (max-width:520px){.story{grid-template-columns:minmax(0,1fr);gap:4px}}
.watch{border-radius:20px;background:var(--surface);padding:20px;display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(var(--bar) + 20px)}
@media (max-width:960px){.watch{position:static}}
.watch h3{margin:0;font:700 19px var(--display)}
.ms{display:grid;grid-template-columns:54px minmax(0,1fr);gap:12px}
.ms time{font:800 15px/1.1 var(--display);color:var(--brand)}
.ms b{display:block;font-size:14.5px}
.ms span{font-size:13px;color:var(--soft)}

.empty{padding:30px;text-align:center;color:var(--soft);border:1px dashed var(--line);border-radius:16px}
.foot{color:var(--faint);font-size:12.5px;margin-top:36px;max-width:80ch}


/* CV match */
.ring{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--rc) calc(var(--p)*1%),#eef0f4 0);flex:none}
.ring b{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;font:800 14px var(--display);color:var(--ink)}
.why{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.why i{font-style:normal;font-size:11.5px;font-weight:600;color:var(--soft);background:var(--surface);border-radius:6px;padding:1px 7px}
.tier{margin-bottom:26px}
.tier h2{display:flex;align-items:center;gap:10px;font:700 21px var(--display);margin:0 0 2px;letter-spacing:-.01em}
.tier h2 small{font:500 14px var(--body);color:var(--faint)}
.tn{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--ink);color:#fff;font:800 13px var(--display)}
.me{background:linear-gradient(135deg,#eef4ff,#f3fbf6);border-radius:16px;padding:14px}
.me p{margin:0;font-size:13.5px;color:var(--ink)}
/* Leaflet core (inlined) */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;font:13px/1.4 var(--body)}
.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{user-select:none;-webkit-user-drag:none}
.leaflet-container .leaflet-overlay-pane svg{max-width:none!important;max-height:none!important}
.leaflet-container .leaflet-marker-pane img,.leaflet-container .leaflet-tile-pane img,.leaflet-container img.leaflet-image-layer,.leaflet-container .leaflet-tile{max-width:none!important;max-height:none!important;width:auto;padding:0}
.leaflet-container.leaflet-touch-zoom{touch-action:pan-x pan-y}
.leaflet-container.leaflet-touch-drag{touch-action:pinch-zoom}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom{touch-action:none}
.leaflet-tile{filter:inherit;visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-zoom-box{width:0;height:0;box-sizing:border-box;z-index:800}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{z-index:100}.leaflet-map-pane svg{z-index:200}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}

function popupHTML(it){
  const owners=cos(it);
  const facts=it.kind==="plant"
   ?`<dt>Location</dt><dd>${esc(it.loc)}</dd><dt>Capacity</dt><dd>${esc(it.cap)}</dd><dt>Feedstock</dt><dd>${esc(it.feed)}</dd>`
   :`<dt>Location</dt><dd>${esc(it.loc)}</dd><dt>Scale</dt><dd>${esc(it.cap)}</dd><dt>Investment</dt><dd>${esc(it.inv)}</dd><dt>Timeline</dt><dd>${esc(it.tl)}</dd><dt>Contractor</dt><dd>${esc(it.epc)}</dd>`;

   <div class="tags">${it.cats.map(c=>`<span class="tag" style="--c:${col(c)}"><i class="d"></i>${CATS[c].l}</span>`).join("")}</div>

   <div class="joblist"><h4>${it.jobs.length?`${it.jobs.length} engineering job${it.jobs.length>1?"s":""} open`:"No engineering ads found this month"}</h4>
   ${it.jobs.map(j=>`<a class="mini" href="${j.u}" target="_blank" rel="noopener"><b>${esc(j.t)}</b><span>${esc(jobCo(j))}, ${esc(j.loc)}, ${fmtD(j.d)}</span></a>`).join("")}
   ${owners.map(k=>(owners.length>1?`<span class="muted">Search ${esc(coName(k))}</span>`:"")+searchLinks(k)).join("")}</div></div>`;
}
function siteCard(it){

/* ---------- router ---------- */
let current=null;
function route(){
  const h=(location.hash||"#map").slice(1);const v=VIEWS.some(([k])=>k===h)?h:"map";
  current=v;
  VIEWS.forEach(([k])=>{$("#v-"+k).hidden=k!==v});
  document.querySelectorAll("[data-v]").forEach(a=>{if(a.dataset.v===v)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  if(v==="map"&&map)setTimeout(()=>map.invalidateSize(),30);
  if(v!=="map")window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);

let base=null,tileOk=false,tileErr=0,outline=null;
function setBase(name){
  if(!map)return;if(base)map.removeLayer(base);base=BASES[name]().addTo(map);
  const watch=l=>{l.on("tileload",()=>{tileOk=true;$("#mapnote").hidden=true});l.on("tileerror",()=>{tileErr++;if(!tileOk&&tileErr>3)useOutline()})};
  base.eachLayer?base.eachLayer(watch):watch(base);
  document.querySelectorAll("#basemaps button").forEach(b=>b.setAttribute("aria-pressed",b.textContent===name));
}
function useOutline(){if(outline)return;outline=L.layerGroup([AUS,TAS].map(r=>L.polygon(r.map(([lo,la])=>[la,lo]),{className:"outline",color:"#d6cfbd",weight:1.2,fillOpacity:1,interactive:false}))).addTo(map);
  const n=$("#mapnote");n.textContent="Map imagery is blocked in this preview. Satellite, light and street views load on your published website.";n.hidden=false}
function pinIcon(it){const cls=["pin",it.kind==="project"?"proj":"",it.kind==="plant"&&it.st!=="op"?it.st:"",it.jobs.length?"hire":""].join(" ");
  return L.divIcon({className:"",html:`<span class="${cls}" style="--c:${col(it.cats[0])}"></span>`,iconSize:[16,16],iconAnchor:[8,8],popupAnchor:[0,-8]})}
function mapVisible(it){const f=mapFilter;
  if(f.kind==="plant"&&it.kind!=="plant")return false;if(f.kind==="project"&&it.kind!=="project")return false;
  if(f.hire&&!it.jobs.length)return false;if(f.cat&&!it.cats.includes(f.cat))return false;
  if(f.q){const hay=(it.n+" "+cos(it).map(coName).join(" ")+" "+it.loc+" "+it.cats.map(c=>CATS[c].l).join(" ")).toLowerCase();if(!hay.includes(f.q))return false}
  return true}
function drawMarkers(){if(!map)return;ITEMS.forEach(it=>{const v=mapVisible(it);if(v&&!map.hasLayer(it.m))it.m.addTo(map);if(!v&&map.hasLayer(it.m))map.removeLayer(it.m)})}
function mapChips(){
  const f=mapFilter;const c=(label,pressed,act,dot)=>`<button class="chip" aria-pressed="${pressed}" data-act="${act}">${dot?`<i class="d" style="--c:${dot}"></i>`:""}${label}</button>`;
  $("#mapchips").innerHTML=c("Everything",f.kind==="all"&&!f.hire&&!f.cat,"all")+c("Plants",f.kind==="plant","kind:plant")+c("Projects",f.kind==="project","kind:project")+c("Hiring now",f.hire,"hire","#22c55e")+
   (f.cat?c(CATS[f.cat].l+" ✕",true,"cat:",col(f.cat)):"")+
   Object.keys(CATS).filter(k=>k!==f.cat).map(k=>c(CATS[k].l,false,"cat:"+k,col(k))).join("");
}
$("#mapchips").addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  if(a==="all")mapFilter={kind:"all",cat:null,hire:false,q:mapFilter.q};
  else if(a.startsWith("kind:")){const k=a.slice(5);mapFilter.kind=mapFilter.kind===k?"all":k}
  else if(a==="hire")mapFilter.hire=!mapFilter.hire;
  else if(a.startsWith("cat:"))mapFilter.cat=a.slice(4)||null;
  mapChips();drawMarkers()});
$("#mq").addEventListener("input",e=>{mapFilter.q=e.target.value.trim().toLowerCase();drawMarkers()});
function initMap(){
  if(typeof L==="undefined"){$("#map").innerHTML='<p style="padding:90px 20px">The map could not load. Check your internet connection and reload the page.</p>';return}
  map=L.map("map",{zoomControl:false,minZoom:3,maxBounds:[[-52,92],[2,178]]}).setView([-27,134],4);
  L.control.zoom({position:"topright"}).addTo(map);map.attributionControl.setPrefix(false);
  $("#basemaps").innerHTML=Object.keys(BASES).map(n=>`<button aria-pressed="false">${n}</button>`).join("");
  $("#basemaps").onclick=e=>{const b=e.target.closest("button");if(b)setBase(b.textContent)};
  setBase("Satellite");
  const small=window.innerWidth<600;
  ITEMS.forEach(it=>{it.m=L.marker([it.lat,it.lon],{icon:pinIcon(it),title:it.n,riseOnHover:true,zIndexOffset:it.kind==="project"?400:0});
    it.m.bindPopup(()=>popupHTML(it),{maxWidth:small?290:350,minWidth:small?250:300,maxHeight:small?Math.round(window.innerHeight*.55):460,autoPanPaddingTopLeft:[20,120],autoPanPaddingBottomRight:[20,40]})});
  drawMarkers();
}
function goTo(i){const it=ITEMS[i];location.hash="#map";
  if(!mapVisible(it)){mapFilter={kind:"all",cat:null,hire:false,q:""};$("#mq").value="";mapChips();drawMarkers()}
  setTimeout(()=>{if(!map)return;map.invalidateSize();map.flyTo([it.lat,it.lon],Math.max(map.getZoom(),11),{duration:.9});setTimeout(()=>it.m.openPopup(),950)},80)}
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g){e.preventDefault();goTo(+g.dataset.go)}});

/* ---------- CV matching (Shahin C P) ---------- */
const PROFILE={name:"Shahin",summary:"Mechanical Project Engineer, 10+ years. Equipment and piping installation, brownfield capex in refineries and process plants. P&IDs, layouts and GA drawings; valves; pressure, vacuum and flushing tests with commissioning teams. ASME B31.3 and AS4041 piping. Built CMMS, asset hierarchy and maintenance and shutdown planning. WBS, project planning and scheduling; drawing and vendor document review. Oilseeds, renewable fuels, chemicals. Engineers Australia PEng, Australian PR."};
const TITLE_FIT=[
 [/mechanical project engineer|project mechanical engineer|senior mechanical project/i,34,"Mechanical project role"],
 [/(senior|lead).*(mechanical|project) engineer|project engineers?\b.*(lead|senior)/i,32,"Senior project / mechanical role"],
 [/maintenance plann|planning lead|shutdown plann|turnaround|cmms|asset (engineer|management)|maintenance systems/i,31,"Maintenance planning, CMMS and shutdowns"],
 [/piping/i,31,"Piping, ASME B31.3 / AS4041"],
 [/project engineer|capital project/i,30,"Project engineering role"],
 [/commissioning/i,30,"Commissioning role"],
 [/installation|construction engineer|brownfield/i,28,"Installation and brownfield work"],
 [/mechanical engineer/i,28,"Mechanical engineering role"],
 [/maintenance engineer|plant engineer/i,27,"Plant maintenance engineering"],
 [/reliability/i,26,"Reliability role"],
 [/planning engineer|project control|project planner|senior planner|scheduler|wbs/i,26,"Project planning and scheduling"],
 [/planner/i,22,"Planning role"],
 [/engineering coordinator|document control|design review|drawing/i,20,"Drawing and document review"],

 [/civil|scheduling engineer|software|devsecops|developer|hvac/i,2,"Outside your discipline"]
];
const SECTOR_FIT={graincorp:[25,"Oilseeds, your core sector"],cargill:[25,"Oilseeds, your core sector"],manildra:[24,"Ethanol and oilseeds"],wilmar:[20,"Sugar and ethanol"],aoh:[25,"Oilseeds, your core sector"],
 ampol:[22,"Refinery and renewable fuels"],viva:[22,"Refinery and renewable fuels"],jetzero:[24,"SAF and ethanol"],licella:[20,"Renewable fuels"],wildfire:[20,"Renewable fuels"],hamr:[20,"Renewable fuels"],bp:[20,"Renewable fuels"],
 worley:[20,"EPCM like your De Smet role"],lycopodium:[20,"EPCM process plants"],monadelphous:[17,"SMP construction and shutdowns"],clough:[17,"Process plant EPC"],wood:[17,"Refinery maintenance and EPCM"],
 orica:[17,"Chemical process plant"],nufarm:[18,"Chemical process plant"],ixom:[17,"Chemical process plant"],coogee:[17,"Chemical process plant"],perdaman:[19,"New process plant start-up"],dyno:[14,"Chemical process plant"],csbp:[17,"Chemical process plant"],
 santos:[12,"Oil and gas"],woodside:[12,"Oil and gas"],chevron:[12,"Oil and gas"],inpex:[12,"Oil and gas"],cleanaway:[14,"Waste and resource recovery"],southernoil:[22,"Oil re-refining"],bhp:[8,"Mining"],justbio:[25,"Biodiesel, your sector"],furmanite:[19,"Valves and pressure equipment"],ppg:[18,"Chemical manufacturing plant"],asahi:[17,"Beverage processing plant"],gfg:[15,"Steel manufacturing"],ansto:[14,"Nuclear science facility"],downer:[14,"Power station maintenance"],tdw:[15,"Pipeline and pressure equipment"],kcb:[12,"Mining engineering consultancy"],
 bega:[19,"Food processing plant"],idt:[14,"Pharma manufacturing"],psc:[13,"Pharma and biotech projects"],app:[18,"Pumps and fluid systems"],visy:[15,"Manufacturing plant"],hdr:[10,"Building services"],jci:[13,"Industrial refrigeration"],sulzer:[20,"Pumps, valves and fluid systems"],cpb:[6,"Infrastructure"]};
const TIERS=[
 {k:1,l:"Victoria",d:"Your first choice"},
 {k:2,l:"Sydney, Wollongong & Newcastle",d:"Your second choice"},
 {k:3,l:"Brisbane & suburbs",d:"Your third choice"},
 {k:4,l:"Perth & suburbs",d:"Your fourth choice"},
 {k:5,l:"Other locations",d:"Outside your preferred areas"}
];
const NSW_METRO=/sydney|kemps creek|rooty hill|matraville|botany|richmond nsw|wetherill|kurnell|parramatta|newcastle|wollongong|port kembla|maitland|rutherford|hunter|kooragang|mayfield|carrington|cecil park|riverstone|alexandria|granville|greystanes|penrith|blacktown|illawarra|mascot|norwest|chipping norton|rydalmere|lucas heights|lake macquarie|eraring|north ryde|macquarie park/i;
const BNE=/brisbane|lutwyche|lytton|narangba|wynnum|pinkenba|ipswich|logan|redcliffe|eagle farm|wacol|rocklea|springfield|northgate|milton|ipswich/i;
const PER=/perth|kwinana|welshpool|rockingham|fremantle|malaga|kewdale|henderson|bibra lake|bayswater|osborne park|canning vale/i;
function tierOf(loc){const l=loc||"";if(/\bVIC\b|victoria/i.test(l))return 1;if(NSW_METRO.test(l))return 2;if(BNE.test(l))return 3;if(PER.test(l))return 4;return 5}
function matchOf(j){
  if(j._m)return j._m;
  let t=[0,"Role not matched"];for(const [re,s,why] of TITLE_FIT){if(re.test(j.t)){t=[s,why];break}}
  const s=SECTOR_FIT[j.co]||(j.sf?[j.sf,j.sw||"Process industry"]:[8,"Process industry"]);
  const lv=lvlClass(j.lvl||"");const lvPts=lv==="senior"||lv==="mid"?10:lv==="manager"?5:0;
  const score=Math.max(5,Math.min(99,Math.round((t[0]+s[0]+lvPts)/69*100)));
  const tier=tierOf(j.loc);
  const why=[t[1],s[1]];if(tier<5)why.push(TIERS[tier-1].l);
  return j._m={score,tier,why};
}
function ring(score){const c=score>=80?"#16a34a":score>=65?"#2a5bd7":score>=45?"#d97706":"#94a3b8";
  return `<span class="ring" style="--p:${score};--rc:${c}" title="${score}% match to your CV"><b>${score}</b></span>`}

    body=TIERS.map(t=>{const js=base.filter(j=>matchOf(j).tier===t.k).sort((a,b)=>matchOf(b).score-matchOf(a).score||b.d.localeCompare(a.d));if(!js.length)return"";
      return `<section class="tier"><h2><span class="tn">${t.k}</span>${esc(t.l)}<small>${js.length} role${js.length>1?"s":""}</small></h2><p class="muted" style="margin:0 0 10px">${esc(t.d)}</p><div class="joblist2">${js.map(jobRow).join("")}</div></section>`}).join("")||`<div class="empty">No roles match. Clear a filter or search a different city.</div>`;
  } else {
    const js=base.sort((a,b)=>b.d.localeCompare(a.d));
    body=js.length?`<div class="joblist2">${js.map(jobRow).join("")}</div>`:`<div class="empty">No roles match. Clear a filter or search a different city.</div>`;
  }
  V.innerHTML=`<div class="vhead"><div class="grow"><h1>Engineering jobs</h1><p>${JOBS.length} live roles at plant owners, project developers and EPC contractors. Ranked against your CV and grouped by your preferred locations. Refreshed automatically; last update ${esc(fmtUpdated())}.</p></div>
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="jq" type="search" placeholder="Search roles, companies, cities" value="${esc(jobF.q)}" aria-label="Search jobs"></label></div>
   <div class="jobs-layout"><aside class="side">
     <div class="me"><h3>Matched to your CV</h3><p>${esc(PROFILE.summary)}</p><p class="muted" style="margin:6px 0 0">The score combines role fit, sector fit and seniority. Location sets the order of the groups.</p></div>
     <div><h3>Order</h3><div class="chips">${ch("sort","match","Best for you",jobF.sort)}${ch("sort","new","Newest",jobF.sort)}</div></div>
     <div><h3>Employer</h3><div class="chips">${ch("type","all","All",jobF.type)}${ch("type","own","Owners & developers",jobF.type)}${ch("type","con","Contractors",jobF.type)}</div></div>
     <div><h3>Level</h3><div class="chips">${ch("lvl","all","All levels",jobF.lvl)}${ch("lvl","junior","Junior",jobF.lvl)}${ch("lvl","mid","Mid",jobF.lvl)}${ch("lvl","senior","Senior & lead",jobF.lvl)}${ch("lvl","manager","Manager",jobF.lvl)}</div></div>
     <div><h3>Find recruiters</h3><div class="links">
      <a href="https://www.linkedin.com/search/results/people/?keywords=process%20engineering%20recruiter%20Melbourne" target="_blank" rel="noopener">Melbourne process recruiters</a>
      <a href="https://www.linkedin.com/search/results/people/?keywords=process%20engineering%20recruiter%20Sydney" target="_blank" rel="noopener">Sydney process recruiters</a>

      <a href="https://www.seek.com.au/mechanical-project-engineer-jobs/in-All-Melbourne-VIC" target="_blank" rel="noopener">Seek: Melbourne</a>
      <a href="https://www.seek.com.au/mechanical-project-engineer-jobs/in-All-Sydney-NSW" target="_blank" rel="noopener">Seek: Sydney</a></div></div>
   </aside><div>${body}</div></div>`;
  const qi=$("#jq");qi.oninput=e=>{jobF.q=e.target.value.trim().toLowerCase();const pos=qi.selectionStart;renderJobs();const n=$("#jq");n.focus();n.setSelectionRange(pos,pos)};
}

/* ---------- live data (refreshed by the scheduled task) ---------- */
let UPDATED="2026-10-29T22:00:00+11:00";
function fmtUpdated(){const d=new Date(UPDATED);return isNaN(d)?UPDATED:d.toLocaleString("en-AU",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"})}
async function loadLive(){
  try{const r=await fetch("data.json",{cache:"no-store"});if(!r.ok)return;const d=await r.json();
    if(Array.isArray(d.jobs)&&d.jobs.length){JOBS.length=0;JOBS.push(...d.jobs)}
    if(Array.isArray(d.news)&&d.news.length){NEWS.length=0;NEWS.push(...d.news.filter(n=>CATS[n.tag]))}
    if(d.updated)UPDATED=d.updated;
    ITEMS.forEach(it=>{it.jobs=jobsOf(cos(it));if(it.m)it.m.setIcon(pinIcon(it))});
    const u=$("#updated");if(u)u.textContent="Updated "+fmtUpdated();
    renderIndustries();renderProjects();renderJobs();renderCompanies();renderNews();
  }catch(e){}
}
